name: Build Wanbo Remote Stage 30 Back Home Plus Touch Fix 48

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WanboRemote_Stage30_BackHomePlusTouchFix48.zip -d project

          echo "=== PROJECT ==="
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Find Gradle project
        id: gradle_project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project bulunamadı."
            find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f | sort
            exit 1
          fi

          GRADLE_DIR=$(dirname "$SETTINGS")

          echo "Gradle project: $GRADLE_DIR"
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK FILES ==="

          find "$GITHUB_WORKSPACE/project" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK bulunamadı."
            echo "=== BUILD FILES ==="
            find "$GITHUB_WORKSPACE/project" \
              -type f \
              -path "*/build/*" \
              -print
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage30-BackHomePlusTouchFix48-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
