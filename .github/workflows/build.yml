name: Build Wanbo Remote Stage 31 Native Fingerprint

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP=""

          if [ -f "WanboRemote_Stage31_NativeFingerprint.zip" ]; then
            ZIP="WanboRemote_Stage31_NativeFingerprint.zip"
          else
            ZIP=$(find . -maxdepth 3 -type f \
              -name 'WanboRemote_Stage31_*.zip' \
              -print -quit || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Stage31 ZIP bulunamadı."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "ZIP: $ZIP"

          rm -rf build_project
          mkdir -p build_project

          unzip -q "$ZIP" -d build_project

          PROJECT_FILE=$(find build_project \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -type f \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: ZIP içinde Gradle projesi bulunamadı."
            find build_project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Gradle proje dizini: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          echo "Gradle projesi OK."

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK oluşturuldu:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage31-NativeFingerprint-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
