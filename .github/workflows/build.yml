name: Build Wanbo Remote Stage 5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          unzip -q WanboRemote_Stage5_LayoutFix8.zip -d project
          echo "Building from:"
          pwd
          find project -maxdepth 2 -type f | sort | head -50

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project/wanbo_stage5
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage5-LayoutFix8-APK
          path: project/wanbo_stage5/app/build/outputs/apk/debug/app-debug.apk
