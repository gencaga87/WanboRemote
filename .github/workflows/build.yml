name: Build Wanbo Remote Stage 9 Search UX Fix 19

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WanboRemote_Stage9_SearchUXFix19.zip -d project
          echo "Extracted project:"
          find project -maxdepth 2 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle project
        working-directory: project/fix19
        run: |
          echo "Gradle project:"
          pwd
          ls -la
          echo "App:"
          ls -la app

      - name: Build APK
        working-directory: project/fix19
        run: |
          gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh project/fix19/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage9-SearchUXFix19-APK
          path: project/fix19/app/build/outputs/apk/debug/app-debug.apk
