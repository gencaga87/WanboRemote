name: Build Wanbo Remote Stage 5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Stage 5 project
        run: |
          rm -rf project
          mkdir project

          unzip -q WanboRemote_Stage5_Design.zip -d project

          echo "=== ZIP CONTENT ==="
          find project -maxdepth 4 -type f | sort

          echo "=== FIND GRADLE PROJECT ==="
          GRADLE_DIR=$(find project -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$GRADLE_DIR" ]; then
            echo "Gradle projesi bulunamadı!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_DIR")

          echo "Gradle project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Building from:"
          pwd
          ls -la
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
