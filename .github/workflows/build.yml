name: Build Wanbo Remote Stage 29 Plus Fine Fix 47

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WanboRemote_Stage29_VolumeFocusPlusTouchFineFix47.zip -d project

          echo "=== PROJECT ==="
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

