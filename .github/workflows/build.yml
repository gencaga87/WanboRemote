name: Build Wanbo Remote

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Bluetooth Hybrid project
        shell: bash
        run: |
          set -e

          ZIP="WanboRemote_GitHub_BluetoothHybrid_Stage28.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP bulunamadı."
            echo ""
            echo "Repository'deki ZIP dosyaları:"
            find . -maxdepth 1 -type f -name "*.zip" -printf '%f\n' | sort
            exit 1
          fi

          rm -rf build_project
          mkdir build_project

          unzip -q "$ZIP" -d build_project

          echo "Extracted files:"
          find build_project -maxdepth 3 -type f | sort

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find build_project \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -type f \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle(.kts) bulunamadı."
            find build_project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK bulunamadı."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-BluetoothHybrid-Debug
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
