name: Build Wanbo Remote Stage 36 HDMI2 Direct Fix 55

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WanboRemote_Stage36_HDMI2DirectFix55.zip -d project
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Find Gradle project
        id: gradle_project
        shell: bash
        run: |
          SETTINGS=$(find "$GITHUB_WORKSPACE/project" -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle bulunamadı!"
            exit 1
          fi

          GRADLE_DIR=$(dirname "$SETTINGS")
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK:"
          find "$GITHUB_WORKSPACE/project" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage36-HDMI2DirectFix55-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
