name: Build Wanbo Remote Stage 17 Button Feedback Haptic Fix 28

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q WanboRemote_Stage17_ButtonFeedbackHapticFix29.zip -d project

          echo "=== PROJECT ROOT ==="
          ls -la project

          echo ""
          echo "=== GRADLE FILES ==="
          find project -maxdepth 2 -type f \
            \( -name "settings.gradle*" -o -name "build.gradle*" -o -name "gradle.properties" \) \
            -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle project
        working-directory: project
        run: |
          echo "=== GRADLE PROJECT ==="
          pwd

          echo ""
          echo "=== SETTINGS ==="
          cat settings.gradle.kts

          echo ""
          echo "=== APP FILES ==="
          find app -maxdepth 4 -type f | sort

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find project -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK bulunamadı."
            find project -type f | sort
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage17-ButtonFeedbackHapticFix29-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
