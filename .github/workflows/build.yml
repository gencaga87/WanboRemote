name: Build Wanbo Remote Stage 12 Header Clean Fix 23

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WanboRemote_Stage12_HeaderCleanFix23.zip -d project

          echo "=== EXTRACTED PROJECT ==="
          find project -maxdepth 2 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle project
        working-directory: project
        run: |
          echo "=== GRADLE PROJECT ==="
          pwd

          echo "=== PROJECT FILES ==="
          ls -la

          echo "=== APP ==="
          ls -la app

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage12-HeaderCleanFix23-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
