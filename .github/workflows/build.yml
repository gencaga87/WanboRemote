name: Build Wanbo Remote Stage 14 Header Background Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WanboRemote_Stage14_HeaderBackgroundFix.zip -d project

          echo "=== EXTRACTED PROJECT ==="
          find project -maxdepth 3 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Gradle project
        id: gradle_project
        shell: bash
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle veya settings.gradle.kts bulunamadı."
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          GRADLE_DIR=$(dirname "$SETTINGS")

          echo "Gradle project: $GRADLE_DIR"
          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find project -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK bulunamadı."
            find project -type f | sort
            exit 1
          fi

          echo "APK bulundu: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage14-HeaderBackgroundFix-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
