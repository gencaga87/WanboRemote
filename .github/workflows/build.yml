name: Build Wanbo Remote Stage 33 Bluetooth Service Probe Fix1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP=""

          if [ -f "WanboRemote_Stage33_BluetoothServiceProbe_Fix1.zip" ]; then
            ZIP="WanboRemote_Stage33_BluetoothServiceProbe_Fix1.zip"
          else
            ZIP=$(find . -maxdepth 3 -type f \
              -name 'WanboRemote_Stage33_*Fix1.zip' \
              -print -quit || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Stage33 Fix1 ZIP bulunamadı."
            echo "Repository içeriği:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Kullanılan ZIP: $ZIP"

          rm -rf build_project
          mkdir -p build_project

          unzip -q "$ZIP" -d build_project

          PROJECT_FILE=$(find build_project \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -type f \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: ZIP içinde settings.gradle(.kts) bulunamadı."
            find build_project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Gradle proje dizini: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          echo "Gradle projesi bulundu:"
          pwd
          ls -la

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK oluşturulamadı."
            find app/build -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          echo "APK başarıyla oluşturuldu:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage33-BluetoothServiceProbe-Fix1-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
