name: Build Wanbo Remote Stage 10 Scan Spinner Fix 20

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q WanboRemote_Stage10_ScanSpinnerFix21.zip -d project

          echo "=== PROJECT FILES ==="
          find project -maxdepth 3 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Check Android project
        working-directory: project
        run: |
          echo "=== GRADLE PROJECT ==="
          pwd
          echo ""
          echo "=== ROOT FILES ==="
          ls -la
          echo ""
          echo "=== APP DIRECTORY ==="
          ls -la app
          echo ""
          echo "=== SETTINGS ==="
          cat settings.gradle.kts

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "=== APK ==="
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage10-ScanSpinnerFix21-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
