name: Build Wanbo Remote Stage 15 Header And Search Fix 26

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q WanboRemote_Stage15_HeaderAndSearchFix26.zip -d project

          echo "=== EXTRACTED FILES ==="
          find project -maxdepth 5 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Find Gradle project
        id: gradle_project
        shell: bash
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle veya settings.gradle.kts bulunamadı."
            echo ""
            echo "=== PROJECT FILES ==="
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          GRADLE_DIR=$(dirname "$SETTINGS")

          echo "Gradle project bulundu:"
          echo "$GRADLE_DIR"

          echo "gradle_dir=$GRADLE_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle project
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          echo "=== GRADLE PROJECT ==="
          pwd

          echo ""
          echo "=== PROJECT FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: ${{ steps.gradle_project.outputs.gradle_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find project -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK bulunamadı."

            echo ""
            echo "=== BUILD OUTPUTS ==="
            find project -type f | sort

            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage15-HeaderAndSearchFix26-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
