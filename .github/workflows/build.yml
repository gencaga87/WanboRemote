name: Build Wanbo Remote Stage 11 PIN Dialog Spinner Size Fix 22

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q WanboRemote_Stage11_PINDialog_SpinnerSizeFix22.zip -d project

          echo "=== EXTRACTED PROJECT ==="
          find project -maxdepth 3 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle project
        working-directory: project/fix21src
        run: |
          echo "=== GRADLE PROJECT ==="
          pwd
          echo ""
          echo "=== PROJECT FILES ==="
          ls -la
          echo ""
          echo "=== APP ==="
          ls -la app

      - name: Build APK
        working-directory: project/fix21src
        run: |
          gradle assembleDebug --stacktrace

      - name: Check APK
        run: |
          ls -lh project/fix21src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage11-PINDialog-SpinnerSizeFix22-APK
          path: project/fix21src/app/build/outputs/apk/debug/app-debug.apk
