name: Build Wanbo Remote Stage 28 Protocol Logger

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Android Gradle project
        id: project
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | sed -n '1,160p'

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            echo "Found Gradle project in repository root."
            exit 0
          fi

          ZIP=""

          if [ -f "WanboRemote_Stage28_ProtocolLogger_Fix3.zip" ]; then
            ZIP="WanboRemote_Stage28_ProtocolLogger_Fix3.zip"
          else
            ZIP=$(find . -maxdepth 3 -type f -name 'WanboRemote_*.zip' -print -quit || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Gradle projesi bulunamadı."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf build_project
          mkdir -p build_project

          unzip -q "$ZIP" -d build_project

          PROJECT_FILE=$(find build_project \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -type f \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: ZIP açıldı fakat settings.gradle(.kts) bulunamadı."
            find build_project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Verify Gradle project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          echo "Gradle project verified."

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Stage28-ProtocolLogger-Fix3-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
