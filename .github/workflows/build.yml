name: Build Wanbo Remote Test 1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract Android project
        run: |
          unzip -q WanboRemote_Test1.zip -d project
          ls -la project

      - name: Fix Kotlin JVM target
        run: |
          sed -i '/compileSdk = 35/a\
              kotlinOptions {\
                  jvmTarget = "1.8"\
              }' project/app/build.gradle.kts
          cat project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WanboRemote-Test1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
